<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nestle.uz — Boshqaruv paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B1C1D;
    --bg: #FCF6F1;
    --card: #FFFFFF;
    --primary: #D42B3A;
    --primary-dark: #A11C29;
    --accent: #F5A623;
    --muted: #A6968F;
    --line: #F2E4DC;
    --green: #2E9E5B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  h1, h2, .display { font-family: 'Fraunces', serif; }

  /* ===== LOGIN EKRANI ===== */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 8px 30px rgba(200,29,42,0.1);
  }
  .login-box h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--primary-dark);
  }
  .login-box p.sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  .login-box input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .login-box button {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .login-box button:active { transform: scale(0.98); }
  #loginError {
    color: var(--primary);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  /* ===== ADMIN PANEL ===== */
  #adminScreen { display: none; padding-bottom: 60px; }
  header.admin-top {
    background: var(--primary);
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header.admin-top h1 { font-size: 18px; margin: 0; }
  header.admin-top button {
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }

  .toolbar {
    padding: 14px 20px;
    background: var(--bg);
    position: sticky;
    top: 56px;
    z-index: 19;
    border-bottom: 1px solid var(--line);
  }
  .toolbar input {
    width: 100%;
    padding: 11px 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    font-size: 14px;
    font-family: inherit;
  }
  .toolbar .stats {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  .product-list {
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .product-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .product-card .thumb {
    width: 56px; height: 56px;
    border-radius: 10px;
    background: #F4E9E2;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    border: 2px dashed var(--line);
  }
  .product-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .product-card .thumb.dragover { border-color: var(--primary); background: #FCEBE9; }
  .product-card .thumb .icon-hint { font-size: 20px; color: var(--muted); }
  .product-card .thumb input[type=file] { display: none; }

  .product-card .info { flex: 1; min-width: 0; }
  .product-card input.name-input {
    width: 100%;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    font-family: inherit;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 4px 6px;
    margin: -4px -6px 0;
    background: none;
    color: var(--ink);
  }
  .product-card input.name-input:hover { border-color: var(--line); }
  .product-card input.name-input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--card);
  }
  .product-card .path { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .product-card .price-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .product-card .price-row input {
    width: 110px;
    padding: 7px 10px;
    border-radius: 9px;
    border: 1px solid var(--line);
    font-size: 13px;
    font-family: inherit;
  }
  .product-card .price-row span.unit { font-size: 12px; color: var(--muted); }
  .product-card .save-status {
    font-size: 11px;
    margin-left: 4px;
  }
  .save-status.saved { color: var(--green); }
  .save-status.saving { color: var(--accent); }

  .product-card .cat-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .product-card .cat-row .cat-label {
    font-size: 11px;
    color: var(--primary-dark);
    background: #FCEBE9;
    border-radius: 7px;
    padding: 3px 8px;
    font-weight: 600;
  }
  .product-card .cat-row select {
    font-size: 11px;
    padding: 3px 5px;
    border-radius: 7px;
    border: 1px solid var(--line);
    font-family: inherit;
    max-width: 130px;
  }
  .product-card .card-top { display: flex; gap: 12px; align-items: center; width: 100%; }
  .product-card .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    flex-shrink: 0;
    align-self: flex-start;
  }
  .product-card .delete-btn:active { background: #FCEBE9; color: var(--primary); }

  .brands-section { padding: 16px 20px 4px; }
  .brands-title { font-weight: 700; font-size: 14px; margin-bottom: 10px; }
  .brands-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .brand-card {
    flex: 0 0 auto;
    width: 84px;
    text-align: center;
  }
  .brand-card .brand-thumb {
    width: 72px; height: 72px;
    border-radius: 16px;
    background: var(--bg);
    border: 2px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    cursor: pointer;
    margin: 0 auto 6px;
    position: relative;
  }
  .brand-card .brand-thumb.dragover { border-color: var(--primary); background: #FCEBE9; }
  .brand-card .brand-thumb img { width: 100%; height: 100%; object-fit: contain; }
  .brand-card .brand-thumb input[type=file] { display: none; }
  .brand-card .brand-name { font-size: 11px; font-weight: 600; line-height: 1.2; }

  .load-more-btn {
    display: block;
    width: 100%;
    background: var(--card);
    border: 1.5px dashed var(--line);
    color: var(--primary-dark);
    font-weight: 700;
    font-size: 13px;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 6px;
  }
  .load-more-btn:active { background: #FCEBE9; }

  .fab-add {
    position: fixed;
    right: 20px; bottom: 24px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 8px 22px rgba(200,29,42,0.35);
    cursor: pointer;
    z-index: 30;
  }
  .fab-add:active { transform: scale(0.96); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(43,28,29,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card);
    border-radius: 18px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }
  .modal-box h2 { font-size: 17px; margin: 0 0 16px; }
  .modal-box label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    display: block;
    margin: 10px 0 4px;
  }
  .modal-box input, .modal-box select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 14px;
    font-family: inherit;
  }
  .modal-box .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .modal-box .modal-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .modal-box .btn-cancel { background: var(--bg); color: var(--ink); }
  .modal-box .btn-submit { background: var(--primary); color: white; }

  .empty-note {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>

<!-- ============ LOGIN EKRANI ============ -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Boshqaruv paneli</h1>
    <p class="sub">Nestle.uz — narx va rasmlarni boshqarish</p>
    <input id="emailInput" type="email" placeholder="Email" autocomplete="username">
    <input id="passwordInput" type="password" placeholder="Parol" autocomplete="current-password">
    <button onclick="doLogin()">Kirish</button>
    <div id="loginError">Email yoki parol noto'g'ri</div>
  </div>
</div>

<!-- ============ ADMIN PANEL ============ -->
<div id="adminScreen">
  <header class="admin-top">
    <h1>Nestle.uz boshqaruvi</h1>
    <button onclick="doLogout()">Chiqish</button>
  </header>

  <div class="brands-section">
    <div class="brands-title">Bolalar ozuqasi — brend belgilari</div>
    <div class="brands-scroll" id="brandsScroll"></div>
  </div>

  <div class="toolbar">
    <input id="searchInput" type="text" placeholder="Mahsulot qidirish..." oninput="window.SHOW_LIMIT=100;renderList()">
    <div class="stats" id="statsLine"></div>
  </div>
  <div class="product-list" id="productList"></div>
  <button class="fab-add" onclick="openAddModal()">+ Yangi mahsulot</button>
</div>

<!-- ============ YANGI MAHSULOT MODALI ============ -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <h2>Yangi mahsulot qo'shish</h2>
    <label>Mahsulot nomi</label>
    <input type="text" id="newName" placeholder="Masalan: Nan 1 400gr">
    <label>Narxi (so'm)</label>
    <input type="number" id="newPrice" placeholder="0">
    <label>O'lchov birligi</label>
    <select id="newUnit">
      <option value="dona">dona</option>
      <option value="kg">kg</option>
      <option value="quti">quti</option>
      <option value="litr">litr</option>
    </select>
    <label>Qaysi bo'limga qo'shamiz?</label>
    <select id="newCategory"></select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Bekor qilish</button>
      <button class="btn-submit" onclick="submitNewProduct()">Qo'shish</button>
    </div>
  </div>
</div>

<!-- ============ FIREBASE SDK ============ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDocs, collection }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  // ============================================================
  // MUHIM: Quyidagi qiymatlarni O'ZINGIZNING Firebase loyihangiz
  // konfiguratsiyasi bilan almashtiring (Firebase Console >
  // Project Settings > Your apps > SDK setup and configuration).
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAas2JC-8VIQT407fptwRopeGVDUDaua3Y",
    authDomain: "nestleuz-e6cc4.firebaseapp.com",
    projectId: "nestleuz-e6cc4",
    storageBucket: "nestleuz-e6cc4.firebasestorage.app",
    messagingSenderId: "1017152443766",
    appId: "1:1017152443766:web:9d8c4db671050236d11657",
    measurementId: "G-9YGT3SC3Z7"
  };

  // ============================================================
  // MUHIM: Imgur Client ID'ingizni shu yerga qo'ying
  // (api.imgur.com/oauth2/addclient orqali olinadi)
  // ============================================================
  const IMGUR_CLIENT_ID = "PLACEHOLDER_IMGUR_CLIENT_ID";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.doLogin = async function() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      errEl.textContent = "Xatolik: " + (e.message || "Email yoki parol noto'g'ri");
      errEl.style.display = 'block';
    }
  };

  window.doLogout = function() {
    signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminScreen').style.display = 'block';
      loadOverrides().then(renderList);
      loadCategoryIcons().then(renderBrands);
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminScreen').style.display = 'none';
    }
  });

  // Firestore'dan hozirgi narx/rasm ustma-ustlarini yuklaymiz
  window.OVERRIDES = {};
  window.CUSTOM_PRODUCTS = [];
  async function loadOverrides() {
    const snap = await getDocs(collection(db, 'products'));
    const knownCodes = new Set((window.PRODUCTS_FLAT || []).map(p => p.code));
    snap.forEach(d => {
      const data = d.data();
      window.OVERRIDES[d.id] = data;
      // Agar bu kod asl ro'yxatda bo'lmasa va kategoriyasi bor bo'lsa - bu admin qo'shgan yangi mahsulot
      if (!knownCodes.has(d.id) && data.categoryPath && data.name) {
        window.CUSTOM_PRODUCTS.push({ code: d.id, name: data.name, path: '', price: data.price || 0 });
      }
    });
  }

  window.CATEGORY_ICONS = {};
  async function loadCategoryIcons() {
    const snap = await getDocs(collection(db, 'categories'));
    snap.forEach(d => {
      window.CATEGORY_ICONS[d.id] = d.data();
    });
  }

  window.renderBrands = function() {
    const el = document.getElementById('brandsScroll');
    el.innerHTML = (window.BABY_BRANDS || []).map(b => {
      const pathJoined = b.path.join('|');
      const icon = window.CATEGORY_ICONS[pathJoined];
      const thumbContent = icon && icon.iconImg
        ? `<img src="${icon.iconImg}" alt="">`
        : `<span class="icon-hint">🏷</span>`;
      return `
        <div class="brand-card">
          <div class="brand-thumb" id="brand-thumb-${pathJoined}"
               ondragover="event.preventDefault(); this.classList.add('dragover')"
               ondragleave="this.classList.remove('dragover')"
               ondrop="handleBrandDrop(event, '${pathJoined}')"
               onclick="document.getElementById('brand-file-${pathJoined}').click()">
            ${thumbContent}
            <input type="file" id="brand-file-${pathJoined}" accept="image/*" onchange="handleBrandFileSelect(event, '${pathJoined}')">
          </div>
          <div class="brand-name">${b.label}</div>
        </div>`;
    }).join('');
  };

  window.uploadCategoryIcon = async function(pathJoined, file) {
    const thumb = document.getElementById('brand-thumb-' + pathJoined);
    const formData = new FormData();
    formData.append('image', file);
    try {
      const res = await fetch('https://api.imgur.com/3/image', {
        method: 'POST',
        headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` },
        body: formData,
      });
      const data = await res.json();
      if (data.success && data.data && data.data.link) {
        const iconUrl = data.data.link;
        await setDoc(doc(db, 'categories', pathJoined), { iconImg: iconUrl }, { merge: true });
        window.CATEGORY_ICONS[pathJoined] = { ...(window.CATEGORY_ICONS[pathJoined] || {}), iconImg: iconUrl };
        thumb.innerHTML = `<img src="${iconUrl}" alt="">`;
      } else {
        alert("Belgi yuklashda xatolik: " + (data.data?.error || 'noma\'lum xato'));
      }
    } catch (e) {
      alert("Belgi yuklashda xatolik yuz berdi");
      console.error(e);
    }
  };

  window.handleBrandDrop = function(e, pathJoined) {
    e.preventDefault();
    e.currentTarget.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) uploadCategoryIcon(pathJoined, file);
  };
  window.handleBrandFileSelect = function(e, pathJoined) {
    const file = e.target.files[0];
    if (file) uploadCategoryIcon(pathJoined, file);
  };

  window.savePrice = async function(code, price) {
    const statusEl = document.getElementById('status-' + code);
    if (statusEl) { statusEl.textContent = 'Saqlanmoqda...'; statusEl.className = 'save-status saving'; }
    try {
      await setDoc(doc(db, 'products', code), { price: Number(price) || 0 }, { merge: true });
      window.OVERRIDES[code] = { ...(window.OVERRIDES[code] || {}), price: Number(price) || 0 };
      if (statusEl) { statusEl.textContent = 'Saqlandi ✓'; statusEl.className = 'save-status saved'; }
    } catch (e) {
      if (statusEl) { statusEl.textContent = 'Xatolik!'; statusEl.className = 'save-status'; }
      console.error(e);
    }
  };

  window.saveName = async function(code, name) {
    const statusEl = document.getElementById('status-' + code);
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    if (statusEl) { statusEl.textContent = 'Saqlanmoqda...'; statusEl.className = 'save-status saving'; }
    try {
      await setDoc(doc(db, 'products', code), { name: trimmed }, { merge: true });
      window.OVERRIDES[code] = { ...(window.OVERRIDES[code] || {}), name: trimmed };
      if (statusEl) { statusEl.textContent = 'Saqlandi ✓'; statusEl.className = 'save-status saved'; }
    } catch (e) {
      if (statusEl) { statusEl.textContent = 'Xatolik!'; statusEl.className = 'save-status'; }
      console.error(e);
    }
  };

  window.deleteProduct = async function(code, name) {
    if (!confirm(`"${name}" botdan butunlay olib tashlansinmi?`)) return;
    try {
      await setDoc(doc(db, 'products', code), { deleted: true }, { merge: true });
      window.OVERRIDES[code] = { ...(window.OVERRIDES[code] || {}), deleted: true };
      renderList();
    } catch (e) {
      alert("Xatolik yuz berdi");
      console.error(e);
    }
  };

  window.changeCategory = async function(code, pathJoined) {
    const statusEl = document.getElementById('status-' + code);
    const pathArr = pathJoined.split('|');
    if (statusEl) { statusEl.textContent = 'Saqlanmoqda...'; statusEl.className = 'save-status saving'; }
    try {
      await setDoc(doc(db, 'products', code), { categoryPath: pathArr }, { merge: true });
      window.OVERRIDES[code] = { ...(window.OVERRIDES[code] || {}), categoryPath: pathArr };
      if (statusEl) { statusEl.textContent = 'Saqlandi ✓'; statusEl.className = 'save-status saved'; }
      renderList();
    } catch (e) {
      if (statusEl) { statusEl.textContent = 'Xatolik!'; statusEl.className = 'save-status'; }
      console.error(e);
    }
  };

  window.openAddModal = function() {
    document.getElementById('newName').value = '';
    document.getElementById('newPrice').value = '';
    document.getElementById('addModal').classList.add('open');
  };
  window.closeAddModal = function() {
    document.getElementById('addModal').classList.remove('open');
  };
  window.submitNewProduct = async function() {
    const name = document.getElementById('newName').value.trim();
    const price = Number(document.getElementById('newPrice').value) || 0;
    const unit = document.getElementById('newUnit').value;
    const pathJoined = document.getElementById('newCategory').value;
    if (!name) { alert("Mahsulot nomini kiriting"); return; }
    if (!pathJoined) { alert("Bo'limni tanlang"); return; }
    const code = 'custom_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const pathArr = pathJoined.split('|');
    try {
      await setDoc(doc(db, 'products', code), {
        name, price, unit, categoryPath: pathArr,
      });
      window.OVERRIDES[code] = { name, price, unit, categoryPath: pathArr };
      window.CUSTOM_PRODUCTS.push({ code, name, path: '', price });
      closeAddModal();
      renderList();
    } catch (e) {
      alert("Xatolik yuz berdi");
      console.error(e);
    }
  };

  window.uploadImage = async function(code, file) {
    const thumb = document.getElementById('thumb-' + code);
    const formData = new FormData();
    formData.append('image', file);
    try {
      const res = await fetch('https://api.imgur.com/3/image', {
        method: 'POST',
        headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` },
        body: formData,
      });
      const data = await res.json();
      if (data.success && data.data && data.data.link) {
        const imageUrl = data.data.link;
        await setDoc(doc(db, 'products', code), { imageUrl }, { merge: true });
        window.OVERRIDES[code] = { ...(window.OVERRIDES[code] || {}), imageUrl };
        thumb.innerHTML = `<img src="${imageUrl}" alt="">`;
      } else {
        alert("Rasm yuklashda xatolik: " + (data.data?.error || 'noma\'lum xato'));
      }
    } catch (e) {
      alert("Rasm yuklashda xatolik yuz berdi");
      console.error(e);
    }
  };

  window.SHOW_LIMIT = 100;

  window.renderList = function() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('productList');
    const statsEl = document.getElementById('statsLine');
    const all = [...(window.PRODUCTS_FLAT || []), ...(window.CUSTOM_PRODUCTS || [])]
      .filter(p => !(window.OVERRIDES[p.code] && window.OVERRIDES[p.code].deleted));
    const filtered = q ? all.filter(p => {
      const override = window.OVERRIDES[p.code] || {};
      const currentName = override.name !== undefined ? override.name : p.name;
      return currentName.toLowerCase().includes(q) || p.name.toLowerCase().includes(q);
    }) : all;
    const shown = filtered.slice(0, window.SHOW_LIMIT);

    statsEl.textContent = `${filtered.length} ta topildi (${shown.length} tasi ko'rsatilmoqda) — jami ${all.length} ta mahsulot`;

    if (!shown.length) {
      listEl.innerHTML = '<div class="empty-note">Hech narsa topilmadi</div>';
      return;
    }

    listEl.innerHTML = shown.map(p => {
      const override = window.OVERRIDES[p.code] || {};
      const price = override.price !== undefined ? override.price : p.price;
      const name = override.name !== undefined ? override.name : p.name;
      const imageUrl = override.imageUrl || '';
      const thumbContent = imageUrl
        ? `<img src="${imageUrl}" alt="">`
        : `<span class="icon-hint">📷</span>`;
      const nameEsc = name.replace(/"/g, '&quot;');
      const currentPathArr = override.categoryPath || null;
      const currentPathLabel = currentPathArr
        ? (window.CATEGORY_PATHS.find(c => c.path.join('|') === currentPathArr.join('|'))?.label || currentPathArr.join(' > '))
        : p.path;
      const currentPathJoined = currentPathArr ? currentPathArr.join('|') : '';
      return `
        <div class="product-card">
          <div class="card-top">
            <div class="thumb" id="thumb-${p.code}"
                 ondragover="event.preventDefault(); this.classList.add('dragover')"
                 ondragleave="this.classList.remove('dragover')"
                 ondrop="handleDrop(event, '${p.code}')"
                 onclick="document.getElementById('file-${p.code}').click()">
              ${thumbContent}
              <input type="file" id="file-${p.code}" accept="image/*" onchange="handleFileSelect(event, '${p.code}')">
            </div>
            <div class="info">
              <input type="text" class="name-input" value="${nameEsc}" id="name-${p.code}"
                     onblur="saveName('${p.code}', this.value)">
              <div class="price-row">
                <input type="number" value="${price}" id="price-${p.code}"
                       onblur="savePrice('${p.code}', this.value)">
                <span class="unit">so'm</span>
                <span class="save-status" id="status-${p.code}"></span>
              </div>
            </div>
            <button class="delete-btn" title="O'chirish" onclick="deleteProduct('${p.code}', '${nameEsc}')">🗑</button>
          </div>
          <div class="cat-row">
            <span class="cat-label">${currentPathLabel}</span>
            <select onchange="changeCategory('${p.code}', this.value)">
              <option value="">Bo'limni o'zgartirish...</option>
              ${CATEGORY_OPTIONS_HTML}
            </select>
          </div>
        </div>`;
    }).join('');

    if (filtered.length > shown.length) {
      listEl.innerHTML += `<button class="load-more-btn" onclick="showMore()">Yana ${Math.min(100, filtered.length - shown.length)} tasini ko'rsatish (jami ${filtered.length - shown.length} ta qoldi)</button>`;
    }
  };

  window.showMore = function() {
    window.SHOW_LIMIT += 100;
    renderList();
  };

  window.handleDrop = function(e, code) {
    e.preventDefault();
    e.currentTarget.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) uploadImage(code, file);
  };

  window.handleFileSelect = function(e, code) {
    const file = e.target.files[0];
    if (file) uploadImage(code, file);
  };
</script>

<script src="categories-tree.js"></script>
<script src="products-flat.js"></script>
<script src="baby-brands.js"></script>
<script>
  window.PRODUCTS_FLAT = PRODUCTS_FLAT;
  window.CATEGORY_PATHS = CATEGORY_PATHS;
  window.BABY_BRANDS = BABY_BRANDS;
  window.CATEGORY_OPTIONS_HTML = CATEGORY_PATHS.map(c =>
    `<option value="${c.path.join('|')}">${c.label}</option>`
  ).join('');
  document.getElementById('newCategory').innerHTML =
    '<option value="">Tanlang...</option>' + window.CATEGORY_OPTIONS_HTML;
</script>

</body>
</html>
