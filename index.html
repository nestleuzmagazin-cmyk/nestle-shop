<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nestle.uz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF4F3;
    --card: #FFFFFF;
    --ink: #16181C;
    --muted: #86878F;
    --line: #E7E7E5;
    --brand: #E31E3D;
    --brand-deep: #A6112B;
    --brand-wash: #FDEDEF;
    --mint: #128A57;
    --mint-wash: #E7F6EE;
    --mono: 'JetBrains Mono', monospace;
    --ledger-rule: rgba(22,24,28,0.1);
    --confirm-bg: #16181C;
  }
  html.tg-dark {
    --paper: #17181C;
    --card: #1F2024;
    --ink: #F2F1EF;
    --muted: #9A9BA3;
    --line: #2C2D32;
    --brand: #FF4D63;
    --brand-deep: #FF8A97;
    --brand-wash: #3A1620;
    --mint: #2ECC8F;
    --mint-wash: #163B2C;
    --ledger-rule: rgba(255,255,255,0.07);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popScale {
    0% { transform: scale(1); }
    35% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  .anim-rise { animation: riseIn .28s cubic-bezier(.22,.85,.4,1) both; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding-bottom: 150px;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; bottom: 0; left: 11px;
    width: 2px;
    background: rgba(227,30,61,0.38);
    pointer-events: none;
    z-index: 1;
  }
  h1, h2, h3, .display { font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: -0.01em; }

  /* ===== HEADER ===== */
  header.top {
    padding: 14px 16px 10px;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header.top .logo {
    width: 38px; height: 38px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  header.top .logo img { width: 100%; height: 100%; object-fit: contain; }
  header.top .brand { font-family: 'Manrope', sans-serif; font-size: 16.5px; font-weight: 800; letter-spacing: -0.01em; }
  header.top .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* ===== BREADCRUMB (aisle trail) ===== */
  .crumbs {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 2px 16px 6px;
    font-size: 12.5px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .crumbs .back-ic {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 28px; height: 28px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .crumbs button.crumb {
    background: none;
    border: none;
    color: var(--muted);
    font-weight: 600;
    font-size: 12.5px;
    padding: 2px 0;
    cursor: pointer;
  }
  .crumbs button.crumb.current { color: var(--ink); font-weight: 700; }
  .crumbs span.sep { color: var(--line); font-size: 13px; }

  /* ===== SEARCH ===== */
  .search-wrap { padding: 6px 16px 10px; }
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 3px 12px;
    width: 100%;
    transition: border-color .15s ease;
  }
  .search-box:focus-within { border-color: var(--ink); }
  .search-box input {
    border: none;
    outline: none;
    background: none;
    flex: 1;
    width: 0;
    min-width: 0;
    padding: 15px 0 4px;
    line-height: 1.2;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-box .ic { font-size: 13px; color: var(--muted); flex-shrink: 0; padding-top: 3px; }
  .search-clear {
    border: none; background: none; color: var(--muted);
    font-size: 15px; cursor: pointer; padding: 0 2px; flex-shrink: 0;
  }

  /* ===== CHIP RAIL (quick category jump) ===== */
  .chip-rail {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 16px 14px;
    -webkit-overflow-scrolling: touch;
  }
  .chip-rail::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px 7px 7px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: transform .12s ease, border-color .12s ease;
  }
  .chip:active { transform: scale(0.95); }
  .chip .chip-ic {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-size: 13px;
    flex-shrink: 0;
  }
  .chip .chip-ic img { width: 100%; height: 100%; object-fit: contain; }

  /* ===== CATEGORY GRID ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 4px 16px 16px;
  }
  .grid.single { grid-template-columns: 1fr; gap: 0; padding: 4px 16px 16px; }

  /* ===== KATEGORIYA RO'YXATI (ledger entry) ===== */
  .cat-list { padding: 4px 16px 10px; }
  .cat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .1s ease;
  }
  .cat-list .cat-row:first-child { border-top: 1px solid var(--line); }
  .cat-row:active { background: rgba(0,0,0,0.03); }
  .cat-row .icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .cat-row .icon img { width: 100%; height: 100%; object-fit: contain; }
  .cat-row .cat-name { font-weight: 700; font-size: 14px; white-space: nowrap; flex-shrink: 0; }
  .cat-row .dots { flex: 1; border-bottom: 2px dotted var(--line); margin: 0 4px 4px; min-width: 10px; }
  .cat-row .cat-count { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .cat-row .chev { color: var(--muted); font-size: 15px; margin-left: 2px; flex-shrink: 0; }

  /* ===== POPULAR RAIL ===== */
  .popular-section { padding: 2px 0 8px; }
  .popular-title {
    font-family: 'Manrope', sans-serif;
    font-size: 15px; font-weight: 800;
    margin: 4px 16px 10px;
  }
  .popular-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 16px 4px;
    -webkit-overflow-scrolling: touch;
  }
  .popular-scroll::-webkit-scrollbar { display: none; }
  .popular-card {
    flex: 0 0 auto;
    width: 122px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 2px 8px rgba(22,24,28,0.05);
    transition: transform .13s ease;
  }
  .popular-card:active { transform: scale(0.96); }
  .popular-card .icon {
    position: relative;
    width: 100%; height: 96px;
    border-radius: 11px;
    background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .popular-card .icon img { width: 100%; height: 100%; object-fit: cover; }
  .popular-card .name { font-size: 12px; font-weight: 700; line-height: 1.3; min-height: 31px; }
  .popular-card .price {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11.5px; color: var(--brand-deep); font-weight: 800; margin-top: 4px; margin-bottom: 8px;
  }

  /* ===== PRODUCT LIST ROW ===== */
  .product-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    padding: 13px 2px;
    border-bottom: 1px solid var(--line);
  }
  .grid.single .product-row:first-child { border-top: 1px solid var(--line); }
  .product-row .icon {
    position: relative;
    width: 56px; height: 56px; border-radius: 13px;
    background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    overflow: hidden;
  }
  .product-row .info { flex: 1; min-width: 0; }
  .product-row .name { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .ledger-row {
    display: flex;
    align-items: baseline;
    gap: 4px;
    margin-top: 5px;
  }
  .ledger-row .unit-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .ledger-row .dots {
    flex: 1;
    min-width: 8px;
    border-bottom: 2px dotted var(--line);
    margin: 0 2px 3px;
  }
  .ledger-row .price {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }
  .ledger-row .price.set { color: var(--brand-deep); font-weight: 800; }

  /* ===== QO'LDA MIQDOR KIRITISH ===== */
  .qadd-wrap {
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    height: 34px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--card);
  }
  .qadd-wrap input.qty-manual {
    width: 44px;
    height: 100%;
    text-align: center;
    border: none;
    border-radius: 0;
    font-size: 13.5px;
    font-weight: 700;
    font-family: var(--mono);
    color: var(--ink);
    background: transparent;
    padding: 0;
    -moz-appearance: textfield;
  }
  .qadd-wrap input.qty-manual:focus { outline: none; }
  .qadd-wrap input.qty-manual::-webkit-outer-spin-button,
  .qadd-wrap input.qty-manual::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  button.add-btn {
    background: var(--brand);
    color: white;
    border: none;
    width: 34px; height: 100%;
    border-radius: 0;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease, background .15s ease;
    flex-shrink: 0;
    white-space: nowrap;
  }
  button.add-btn:active { background: var(--brand-deep); }
  button.add-btn.added { background: var(--mint); }

  /* mahsulot kartasi ostidagi to'liq eni bo'lgan variant (Tavsiya etiladi) */
  .qadd-wrap.full { width: 100%; margin-top: 8px; }
  .qadd-wrap.full input.qty-manual { flex: 1; width: auto; min-width: 0; }
  .qadd-wrap.full button.add-btn { width: 34px; flex: 0 0 34px; font-size: 17px; }


  /* ===== BOTTOM NAV ===== */
  nav.bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    display: flex;
    padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  nav.bottom-nav .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    position: relative;
    transition: color .2s ease;
  }
  nav.bottom-nav .nav-btn.active { color: var(--brand); }
  nav.bottom-nav .nav-btn.active .ic { animation: popScale .3s ease; }
  nav.bottom-nav .nav-btn .ic { display: inline-flex; transition: transform .15s ease; }
  nav.bottom-nav .nav-btn .ic svg { width: 21px; height: 21px; }
  nav.bottom-nav .nav-btn:active .ic { transform: scale(0.85); }
  nav.bottom-nav .badge {
    position: absolute;
    top: -2px; right: 24%;
    background: var(--brand);
    color: white;
    border-radius: 999px;
    font-size: 10px;
    min-width: 15px;
    height: 15px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 3px;
  }

  /* ===== CART BAR ===== */
  .cart-bar {
    position: fixed;
    bottom: 76px; left: 16px; right: 16px;
    background: var(--ink);
    color: white;
    border-radius: 15px;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    z-index: 40;
    animation: riseIn .3s cubic-bezier(.22,.85,.4,1) both;
    transition: transform .12s ease;
  }
  .cart-bar:active { transform: scale(0.97); }
  .cart-bar.pulse .count { animation: popScale .35s ease; }
  .cart-bar .count {
    background: var(--brand);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 12.5px;
    margin-right: 8px;
    display: inline-block;
  }
  .cart-bar #cartTotal { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ===== SHEETS / MODALS ===== */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(22,24,28,0.5);
    display: flex;
    align-items: flex-end;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .28s ease;
  }
  .sheet-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
  .sheet {
    background: var(--paper);
    width: 100%;
    max-height: 82vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 16px 16px 24px;
    transform: translateY(40px);
    transition: transform .32s cubic-bezier(.32,.94,.6,1);
  }
  .sheet-overlay.open .sheet { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--line);
    border-radius: 4px;
    margin: 0 auto 14px;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }

  .cart-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 11px 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cart-item .name { font-weight: 700; font-size: 13.5px; }
  .cart-item .sub {
    font-size: 12px; color: var(--muted); margin-top: 2px;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .cart-item input.cart-qty-input {
    width: 52px;
    padding: 7px 4px;
    text-align: center;
    border-radius: 9px;
    border: 1px solid var(--line);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 0;
    background: var(--paper);
    font-family: var(--mono);
  }
  .cart-item-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .12s ease, color .12s ease;
  }
  .remove-btn:active { background: var(--brand-wash); color: var(--brand); }

  @keyframes flipUpdate {
    0% { transform: translateY(-7px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .flip-num { display: inline-block; animation: flipUpdate .28s cubic-bezier(.22,.85,.4,1) both; }

  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-weight: 800; font-size: 15.5px;
    padding: 14px 4px 6px;
    border-top: 2px dashed var(--line);
    margin-top: 4px;
  }
  .total-row span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ===== FORM ELEMENTS ===== */
  input, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    margin-bottom: 10px;
    background: var(--card);
    color: var(--ink);
  }
  input:focus, textarea:focus { outline: none; border-color: var(--ink); }
  label.field-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 4px 2px 4px;
    display: block;
  }

  .primary-btn {
    width: 100%;
    background: var(--brand);
    color: white;
    border: none;
    border-radius: 13px;
    padding: 15px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 6px;
    font-family: 'Manrope', sans-serif;
    transition: transform .1s ease;
  }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled { opacity: 0.4; }

  .empty-note {
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    padding: 48px 24px;
  }
  .empty-note .eic {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1.5px dashed rgba(22,24,28,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    margin: 0 auto 12px;
    background: var(--card);
  }
  .empty-note .et { font-weight: 700; color: var(--ink); font-size: 14px; margin-bottom: 3px; }
  .empty-note .es { font-size: 12.5px; }

  /* ===== CONFIRM SCREEN (receipt) ===== */
  @keyframes markPop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  body.confirm-body { background: var(--confirm-bg); padding: 40px 20px; }
  .confirm-screen {
    text-align: center;
    animation: riseIn .35s ease both;
  }
  .confirm-screen .mark {
    width: 56px; height: 56px;
    background: var(--mint);
    color: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin: 0 auto 16px;
    animation: markPop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .receipt {
    background: var(--card);
    max-width: 340px;
    margin: 0 auto;
    padding: 26px 22px 30px;
    text-align: left;
    position: relative;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }
  .receipt::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -12px;
    height: 12px;
    background:
      linear-gradient(135deg, var(--card) 6px, transparent 0) 0 0,
      linear-gradient(-135deg, var(--card) 6px, transparent 0) 0 0;
    background-size: 12px 12px;
    background-repeat: repeat-x;
  }
  .receipt h2 { text-align: center; font-size: 16px; margin: 0 0 2px; }
  .receipt .receipt-sub { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 16px; }
  .receipt .rline {
    display: flex; align-items: baseline; gap: 4px;
    font-family: var(--mono); font-size: 12px; margin-bottom: 7px;
  }
  .receipt .rline .rdots { flex: 1; border-bottom: 1.5px dotted var(--line); margin: 0 2px 3px; }
  .receipt .rline .ramt { font-weight: 700; white-space: nowrap; }
  .receipt hr { border: none; border-top: 2px dashed var(--line); margin: 12px 0; }
  .receipt .rtotal {
    display: flex; justify-content: space-between; font-family: var(--mono);
    font-size: 15px; font-weight: 800; margin-top: 4px;
  }
  .receipt .rfoot { text-align: center; font-size: 11px; color: var(--muted); margin-top: 16px; }

  /* ===== ORDERS ===== */
  .order-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 15px;
    padding: 14px;
    margin: 0 16px 12px;
  }
  .order-card .head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .order-card .head .status { color: var(--brand-deep); font-weight: 700; }
</style>
</head>
<body>

<header class="top">

let path = [];
let cart = [];
let orders = [];
let view = 'catalog';

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready(); tg.expand();
  tg.BackButton.onClick(handleBack);
  applyTelegramTheme();
  tg.onEvent('themeChanged', applyTelegramTheme);
}

function applyTelegramTheme() {
  if (!tg) return;
  const isDark = tg.colorScheme === 'dark';
  document.documentElement.classList.toggle('tg-dark', isDark);
  const p = tg.themeParams || {};
  const root = document.documentElement.style;
  if (p.bg_color) root.setProperty('--tg-bg', p.bg_color);
  if (p.text_color) root.setProperty('--tg-text', p.text_color);
  if (p.hint_color) root.setProperty('--tg-hint', p.hint_color);
  if (p.secondary_bg_color) root.setProperty('--tg-surface', p.secondary_bg_color);
  if (typeof updatePageBackground === 'function') updatePageBackground();
}

function haptic(style) {
  if (!tg || !tg.HapticFeedback) return;
  try {
    if (style === 'light' || style === 'medium' || style === 'rigid' || style === 'soft') {
      tg.HapticFeedback.impactOccurred(style);
    } else if (style === 'success' || style === 'warning' || style === 'error') {
      tg.HapticFeedback.notificationOccurred(style);
    } else {
      tg.HapticFeedback.selectionChanged();
    }
  } catch (e) {}
}

function handleBack() {
  if (view === 'orders') { goHome(); return; }
  if (path.length) { path = path.slice(0, -1); render(); return; }
}

function updateBackButton() {
  if (!tg) return;
  if (view === 'orders' || path.length) tg.BackButton.show();
  else tg.BackButton.hide();
}

function getNode(p) {
  let node = { children: CATALOG };
  for (const code of p) node = (node.children || {})[code];
  return node;
}

function fmt(n) {
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function goHome() {
  view = 'catalog';
  path = [];
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClearBtn').style.display = 'none';
  document.getElementById('crumbs').style.display = '';
  document.getElementById('navHome').classList.add('active');
  document.getElementById('navOrders').classList.remove('active');
  render();
}

function render() {
  const node = getNode(path);
  const content = document.getElementById('content');
  const crumbs = document.getElementById('crumbs');

  crumbs.innerHTML = '';
  if (path.length) {
    const backBtn = document.createElement('button');
    backBtn.className = 'back-ic';
    backBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
    backBtn.onclick = () => handleBack();
    crumbs.appendChild(backBtn);
  }
  const rootBtn = document.createElement('button');
  rootBtn.className = 'crumb' + (path.length === 0 ? ' current' : '');
  rootBtn.textContent = 'Katalog';
  rootBtn.onclick = () => { path = []; render(); };
  crumbs.appendChild(rootBtn);
  let acc = [];
  for (const code of path) {
    acc.push(code);
    const n = getNode(acc);
    const isLast = acc.length === path.length;
    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = '›';
    crumbs.appendChild(sep);
    const b = document.createElement('button');
    b.className = 'crumb' + (isLast ? ' current' : '');
    b.textContent = n.name;
    const target = [...acc];
    b.onclick = () => { path = target; render(); };
    crumbs.appendChild(b);
  }

  content.innerHTML = '';

  const children = node.children || {};
  const products = node.products || {};

  if (Object.keys(children).length) {
    const grid = document.createElement('div');
    grid.className = 'cat-list';
    for (const [code, child] of Object.entries(children)) {
      const row = document.createElement('div');
      row.className = 'cat-row';
      row.onclick = () => { haptic('selection'); path = [...path, code]; render(); };
      const iconHtml = child.iconImg
        ? `<img src="${child.iconImg}" alt="${child.name}">`
        : (child.icon || '📁');
      const tileBg = path.length === 0 ? (CATEGORY_COLORS[code] || DEFAULT_TILE_BG) : (CATEGORY_COLORS[path[0]] || DEFAULT_TILE_BG);
      row.innerHTML = `<div class="icon" style="background:${tileBg}">${iconHtml}</div><div class="cat-name">${child.name}</div><span class="dots"></span><span class="chev">›</span>`;
      grid.appendChild(row);
    }
    content.appendChild(grid);
  }

  if (Object.keys(products).length) {
    const wrap = document.createElement('div');
    wrap.className = 'grid single';
    for (const [code, product] of Object.entries(products)) {
      wrap.appendChild(buildProductRow(code, product));
    }
    content.appendChild(wrap);
  }

  if (!Object.keys(children).length && !Object.keys(products).length) {
    content.innerHTML = '<div class="empty-note"><div class="eic">📦</div><div class="et">Bu yerda hozircha mahsulot yo\'q</div><div class="es">Boshqa bo\'limlarni ko\'rib chiqing</div></div>';
  }

  playRiseIn(content);
  updateCartBar();
  updateBackButton();
  renderPopular();
  renderChipRail();
  updatePageBackground();
}

function renderChipRail() {
  const el = document.getElementById('chipRail');
  if (path.length || view !== 'catalog') { el.innerHTML = ''; return; }
  el.innerHTML = Object.entries(CATALOG).map(([code, n]) => {
    const iconHtml = n.iconImg
      ? `<img src="${n.iconImg}" alt="">`
      : `<span>${n.icon || '📁'}</span>`;
    const bg = CATEGORY_COLORS[code] || DEFAULT_TILE_BG;
    return `<button class="chip" onclick="path=['${code}'];render();"><span class="chip-ic" style="background:${bg}">${iconHtml}</span>${n.name}</button>`;
  }).join('');
}

function playRiseIn(el) {
  el.classList.remove('anim-rise');
  void el.offsetWidth;
  el.classList.add('anim-rise');
}

function countProductsDeep(node) {
  let total = Object.keys(node.products || {}).length;
  for (const c of Object.values(node.children || {})) total += countProductsDeep(c);
  return total;
}

function buildProductRow(code, product) {
  const row = document.createElement('div');
  row.className = 'product-row';
  const priceLabel = product.price ? `${fmt(product.price)} so'm` : `Narx kelishiladi`;
  const bg = categoryColorFor(code);
  row.innerHTML = `
    <div class="icon" style="background:${bg}"><img src="${product.imageUrl || ('assets/products/' + code + '.jpg')}" alt="${product.name}" style="width:100%;height:100%;object-fit:cover;" onerror="if(!this.dataset.triedPng){this.dataset.triedPng='1';this.src='assets/products/${code}.png';}else{this.parentElement.innerHTML='🧴';}"></div>
    <div class="info">
      <div class="name">${product.name}</div>
      <div class="ledger-row">
        <span class="unit-label">${product.unit}</span>
        <span class="dots"></span>
        <span class="price ${product.price ? 'set' : ''}">${priceLabel}</span>
      </div>
    </div>
    <div class="qadd-wrap">
      <input type="number" class="qty-manual" inputmode="numeric" min="1" value="1" onclick="event.stopPropagation()">
      <button class="add-btn" onclick="addFromRow(event,'${code}')">+</button>
    </div>
  `;
  return row;
}

// ============ QO'LDA MIQDOR KIRITIB QO'SHISH ============
function addFromRow(e, code) {
  e.stopPropagation();
  const btn = e.currentTarget;
  const wrap = btn.closest('.qadd-wrap');
  const input = wrap.querySelector('input.qty-manual');
  const qty = parseInt(input.value, 10);
  const product = window.CATALOG_PRODUCT_LOOKUP && window.CATALOG_PRODUCT_LOOKUP[code];
  if (!product || !qty || qty < 1) { input.focus(); return; }
  haptic('light');
  addToCart(code, product, qty);
  input.value = '1';
  const original = btn.innerHTML;
  btn.classList.add('added');
  btn.innerHTML = '✓';
  setTimeout(() => { btn.classList.remove('added'); btn.innerHTML = original; }, 700);
}

// ============ QIDIRUV ============
let allProductsFlat = null;
function resetProductCache() { allProductsFlat = null; }
function flattenAllProducts() {
  if (allProductsFlat) return allProductsFlat;
  const out = [];
  function walk(node, pathNames) {
    for (const [code, product] of Object.entries(node.products || {})) {
      out.push({ code, product, pathNames });
    }
    for (const [code, child] of Object.entries(node.children || {})) {
      walk(child, [...pathNames, child.name]);
    }
  }
  walk({ children: CATALOG }, []);
  allProductsFlat = out;
  return out;
}

function onSearchInput() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const box = document.getElementById('searchInput').closest('.search-box');
  document.getElementById('searchClearBtn').style.display = q ? 'block' : 'none';
  box.style.width = q ? '100%' : '';
  if (!q) {
    document.getElementById('crumbs').style.display = '';
    render();
    return;
  }
  document.getElementById('crumbs').style.display = 'none';
  document.getElementById('popularSection').innerHTML = '';
  document.body.style.background = neutralBg();
  const results = flattenAllProducts().filter(item => item.product.name.toLowerCase().includes(q));
  const content = document.getElementById('content');
  content.innerHTML = '';
  if (!results.length) {
    content.innerHTML = '<div class="empty-note"><div class="eic">🔍</div><div class="et">Hech narsa topilmadi</div><div class="es">Boshqa so\'z bilan qidirib ko\'ring</div></div>';
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'grid single';
  for (const { code, product, pathNames } of results.slice(0, 40)) {
    const row = buildProductRow(code, product);
    const pathTag = document.createElement('div');
    pathTag.style.cssText = 'font-size:11px;color:var(--muted);margin:-4px 0 4px 2px;';
    pathTag.textContent = pathNames.join(' / ');
    row.querySelector('.info').prepend(pathTag);
    wrap.appendChild(row);
  }
  content.appendChild(wrap);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  onSearchInput();
}

// ============ MASHHUR MAHSULOTLAR ============
const POPULAR_CODES = ['nan1_400', 'nescafe_gold_95', 'kitkat_64', 'alpen_milk'];
function renderPopular() {
  const el = document.getElementById('popularSection');
  if (path.length || view !== 'catalog') { el.innerHTML = ''; return; }
  const flat = flattenAllProducts();
  const items = POPULAR_CODES
    .map(code => flat.find(f => f.code === code))
    .filter(Boolean);
  if (!items.length) { el.innerHTML = ''; return; }
  const cards = items.map(({ code, product }) => {
    const priceLabel = product.price ? `${fmt(product.price)} so'm` : "Narx kelishiladi";
    const bg = categoryColorFor(code);
    return `
      <div class="popular-card">
        <div class="icon" style="background:${bg}">
          <img src="${product.imageUrl || ('assets/products/' + code + '.jpg')}" alt="${product.name}" onerror="if(!this.dataset.triedPng){this.dataset.triedPng='1';this.src='assets/products/${code}.png';}else{this.parentElement.textContent='🧴';}">
        </div>
        <div class="name">${product.name}</div>
        <div class="price">${priceLabel}</div>
        <div class="qadd-wrap full">
          <input type="number" class="qty-manual" inputmode="numeric" min="1" value="1" onclick="event.stopPropagation()">
          <button class="add-btn" onclick="addFromRow(event,'${code}')">+</button>
        </div>
      </div>`;
  }).join('');
  el.innerHTML = `
    <div class="popular-section">
      <div class="popular-title">Tavsiya etiladi</div>
      <div class="popular-scroll">${cards}</div>
    </div>`;
}

const CATALOG_PRODUCT_LOOKUP = {};
flattenAllProducts().forEach(({ code, product }) => { CATALOG_PRODUCT_LOOKUP[code] = product; });
window.CATALOG_PRODUCT_LOOKUP = CATALOG_PRODUCT_LOOKUP;
window.CATALOG = CATALOG;
window.getNode = getNode;

// ============ KATEGORIYA RANGLARI (aisle-code) ============
const CATEGORY_COLORS = {
  baby: '#CFE7FA',
  sweets: '#FAD9E3',
  coffee: '#EBDCC7',
  ichimliklar: '#FCEEB0',
  yorma: '#F1E0B8',
  sous_ziravorlar: '#FBDCC0',
  konservalar: '#CFEEDD',
  bolalar_gigiyenasi: '#E5DBF7',
  gazaklar: '#FBE0C8',
  bolalar_aksessuarlari: '#D6E9FA',
  sut_pishloq: '#FCEEB0',
  konserva2: '#CFEEDD',
  tez_taom: '#FBD9CE',
  kakao_choy_kofe: '#EBDCC7',
  urug_gazak2: '#FBE0C8',
  bolalar_aksessuar2: '#D6E9FA',
  bolalar_gigiyena2: '#E5DBF7',
  sirok_yogurt2: '#FCEEB0',
  saqich_konditer: '#FAD9E3',
  shokolad_konfet2: '#FAD9E3',
  moy_yog: '#F0E4C0',
  qadoqlash: '#E5E5E3',
};
const DEFAULT_TILE_BG = '#EFEFEF';

const CODE_TO_TOP_KEY = {};
(function buildCodeToTopKey() {
  function walk(node, topKey) {
    for (const code of Object.keys(node.products || {})) {
      CODE_TO_TOP_KEY[code] = topKey;
    }
    for (const child of Object.values(node.children || {})) {
      walk(child, topKey);
    }
  }
  for (const [topKey, node] of Object.entries(CATALOG)) {
    walk(node, topKey);
  }
})();

function categoryColorFor(code) {
  return CATEGORY_COLORS[CODE_TO_TOP_KEY[code]] || DEFAULT_TILE_BG;
}

function lightenHex(hex, amt) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substring(0, 2), 16);
  const g = parseInt(c.substring(2, 4), 16);
  const b = parseInt(c.substring(4, 6), 16);
  const mix = (v) => Math.round(v + (255 - v) * amt);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

function darkenHex(hex, amt) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substring(0, 2), 16);
  const g = parseInt(c.substring(2, 4), 16);
  const b = parseInt(c.substring(4, 6), 16);
  const mix = (v) => Math.round(v * (1 - amt));
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

function isDarkTheme() {
  return document.documentElement.classList.contains('tg-dark');
}

function neutralBg() {
  return `var(--paper)`;
}
function updatePageBackground() {
  const topKey = path.length ? path[0] : null;
  if (topKey && CATEGORY_COLORS[topKey]) {
    const tint = isDarkTheme()
      ? darkenHex(CATEGORY_COLORS[topKey], 0.82)
      : lightenHex(CATEGORY_COLORS[topKey], 0.6);
    document.body.style.background = tint;
  } else {
    document.body.style.background = neutralBg();
  }
}



function addToCart(code, product, qty) {
  qty = qty || 1;
  const existing = cart.find(i => i.code === code);
  if (existing) { existing.qty += qty; }
  else { cart.push({ code, name: product.name, unit: product.unit, price: product.price, qty: qty }); }
  updateCartBar();
}

function cartTotal() {
  return cart.reduce((sum, i) => sum + (i.price || 0) * i.qty, 0);
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  const count = cart.reduce((s, i) => s + i.qty, 0);
  const badge = document.getElementById('navCartBadge');
  if (count === 0) {
    bar.style.display = 'none';
    badge.style.display = 'none';
    return;
  }
  bar.style.display = view === 'catalog' ? 'flex' : 'none';
  badge.style.display = 'flex';
  badge.textContent = count;
  document.getElementById('cartCount').textContent = count;
  flipText('cartTotal', fmt(cartTotal()) + " so'm");
  bar.classList.remove('pulse');
  void bar.offsetWidth;
  bar.classList.add('pulse');
}

function flipText(elId, text) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = text;
  el.classList.remove('flip-num');
  void el.offsetWidth;
  el.classList.add('flip-num');
}

function openCart() {
  const itemsEl = document.getElementById('cartItems');
  itemsEl.innerHTML = '';
  if (!cart.length) {
    itemsEl.innerHTML = '<div class="empty-note"><div class="eic">🛒</div><div class="et">Savat bo\'sh</div><div class="es">Katalogdan mahsulot qo\'shing</div></div>';
  }
  cart.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'cart-item';
    row.innerHTML = `
      <div>
        <div class="name">${item.name}</div>
        <div class="sub">${item.price ? fmt(item.price) + " so'm x " : ''}${item.unit}</div>
      </div>
      <div class="cart-item-right">
        <input type="number" min="1" inputmode="numeric" class="cart-qty-input" value="${item.qty}">
        <button class="remove-btn" title="Olib tashlash" onclick="removeFromCart(${idx})">✕</button>
      </div>
    `;
    const input = row.querySelector('.cart-qty-input');
    input.onchange = () => setQty(idx, parseInt(input.value, 10));
    itemsEl.appendChild(row);
  });
  flipText('cartSheetTotal', fmt(cartTotal()) + " so'm");
  document.getElementById('cartOverlay').classList.add('open');
}

function removeFromCart(idx) {
  haptic('light');
  cart.splice(idx, 1);
  openCart();
  updateCartBar();
}

function setQty(idx, qty) {
  if (!qty || qty < 1) { cart.splice(idx, 1); }
  else { cart[idx].qty = qty; }
  openCart();
  updateCartBar();
}

function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); }

function showCheckout() {
  if (!cart.length) return;
  document.getElementById('checkoutOverlay').classList.add('open');
}
function closeCheckout() { document.getElementById('checkoutOverlay').classList.remove('open'); }

function showOrders() {
  view = 'orders';
  document.body.style.background = neutralBg();
  document.getElementById('navHome').classList.remove('active');
  document.getElementById('navOrders').classList.add('active');
  document.getElementById('popularSection').innerHTML = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClearBtn').style.display = 'none';
  document.getElementById('crumbs').style.display = '';
  const content = document.getElementById('content');
  document.getElementById('crumbs').innerHTML = '';
  content.innerHTML = '';
  if (!orders.length) {
    content.innerHTML = '<div class="empty-note"><div class="eic">📋</div><div class="et">Hali buyurtmalaringiz yo\'q</div><div class="es">Birinchi buyurtmangizni bering</div></div>';
  } else {
    orders.forEach(o => {
      const card = document.createElement('div');
      card.className = 'order-card';
      const itemsText = o.items.map(i => `${i.name} — ${i.qty} ${i.unit}`).join(', ');
      card.innerHTML = `
        <div class="head"><span>${o.time}</span><span class="status">Yuborildi</span></div>
        <div style="font-size:14px;">${itemsText}</div>
        <div style="font-weight:700; margin-top:6px;">${fmt(o.total)} so'm</div>
      `;
      content.appendChild(card);
    });
  }
  updateCartBar();
  updateBackButton();
}

function submitOrder() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  if (!name || !phone || !address) {
    haptic('error');
    alert("Iltimos, barcha maydonlarni to'ldiring");
    return;
  }
  const order = {
    items: cart.map(i => ({ name: i.name, qty: i.qty, unit: i.unit, price: i.price })),
    total: cartTotal(),
    customer_name: name,
    phone: phone,
    address: address,
    time: new Date().toLocaleString('uz-UZ'),
  };
  orders.push(order);
  haptic('success');

  if (tg) {
    tg.sendData(JSON.stringify(order));
    tg.close();
  } else {
    closeCheckout();
    closeCart();
    cart = [];
    updateCartBar();
    document.body.className = 'confirm-body';
    const itemsHtml = order.items.map(i => {
      const amt = i.price ? fmt(i.price * i.qty) + " so'm" : '—';
      return `<div class="rline"><span>${i.qty} ${i.unit} ${i.name}</span><span class="rdots"></span><span class="ramt">${amt}</span></div>`;
    }).join('');
    document.body.innerHTML = `
      <div class="confirm-screen">
        <div class="mark">✓</div>
        <div class="receipt">
          <h2>Nestle.uz</h2>
          <div class="receipt-sub">${order.time} · sinov rejimi</div>
          ${itemsHtml}
          <hr>
          <div class="rtotal"><span>Jami</span><span>${fmt(order.total)} so'm</span></div>
          <div class="rfoot">Xaridingiz uchun rahmat!<br>Bu ilova Telegram ichida ochilganda,<br>buyurtma avtomatik botga yuboriladi.</div>
        </div>
      </div>`;
    console.log(order);
  }
}

render();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getFirestore, getDocs, collection }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  // MUHIM: admin.html dagi bilan BIR XIL konfiguratsiyani qo'ying
  const firebaseConfig = {
    apiKey: "AIzaSyAas2JC-8VIQT407fptwRopeGVDUDaua3Y",
    authDomain: "nestleuz-e6cc4.firebaseapp.com",
    projectId: "nestleuz-e6cc4",
    storageBucket: "nestleuz-e6cc4.firebasestorage.app",
    messagingSenderId: "1017152443766",
    appId: "1:1017152443766:web:9d8c4db671050236d11657",
    measurementId: "G-9YGT3SC3Z7"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const snap = await getDocs(collection(db, 'products'));

    const catSnap = await getDocs(collection(db, 'categories'));
    let categoryIconsUpdated = 0;
    catSnap.forEach(d => {
      const data = d.data();
      if (!data.iconImg) return;
      const pathArr = d.id.split('|');
      const target = window.getNode(pathArr);
      if (target) { target.iconImg = data.iconImg; categoryIconsUpdated++; }
    });

    const toDelete = [];
    const toMove = [];
    const toAdd = [];
    let priceNameImageUpdated = 0;

    snap.forEach(d => {
      const code = d.id;
      const data = d.data();
      const product = window.CATALOG_PRODUCT_LOOKUP && window.CATALOG_PRODUCT_LOOKUP[code];

      if (data.deleted) {
        if (product) toDelete.push(code);
        return;
      }

      if (!product) {
        // Asl katalogda yo'q - admin qo'shgan YANGI mahsulot
        if (data.categoryPath && data.name) {
          toAdd.push({ code, name: data.name, price: data.price || 0, unit: data.unit || 'dona', imageUrl: data.imageUrl, categoryPath: data.categoryPath });
        }
        return;
      }

      if (data.categoryPath) {
        toMove.push({ code, categoryPath: data.categoryPath });
      }

      if (data.price !== undefined) product.price = data.price;
      if (data.imageUrl) product.imageUrl = data.imageUrl;
      if (data.name) product.name = data.name;
      priceNameImageUpdated++;
    });

    function removeFromTree(code) {
      function walk(node) {
        if (node.products && node.products[code]) { delete node.products[code]; return true; }
        for (const child of Object.values(node.children || {})) {
          if (walk(child)) return true;
        }
        return false;
      }
      walk({ children: window.CATALOG });
    }

    toDelete.forEach(code => removeFromTree(code));

    toMove.forEach(({ code, categoryPath }) => {
      const product = window.CATALOG_PRODUCT_LOOKUP[code];
      removeFromTree(code);
      const target = getNode(categoryPath);
      if (target) {
        target.products = target.products || {};
        target.products[code] = product;
      }
    });

    toAdd.forEach(({ code, name, price, unit, imageUrl, categoryPath }) => {
      const target = getNode(categoryPath);
      if (target) {
        target.products = target.products || {};
        const newProduct = { name, price, unit };
        if (imageUrl) newProduct.imageUrl = imageUrl;
        target.products[code] = newProduct;
      }
    });

    // Daraxt o'zgargani uchun qidiruv/lookup kesh(lar)ini qayta quramiz
    if (toDelete.length || toMove.length || toAdd.length) {
      if (typeof resetProductCache === 'function') resetProductCache();
      const newLookup = {};
      const newCodeToTop = {};
      function rebuildLookups(node, topKey) {
        for (const [code, p] of Object.entries(node.products || {})) {
          newLookup[code] = p;
          newCodeToTop[code] = topKey;
        }
        for (const child of Object.values(node.children || {})) {
          rebuildLookups(child, topKey);
        }
      }
      for (const [topKey, node] of Object.entries(window.CATALOG)) {
        rebuildLookups(node, topKey);
      }
      window.CATALOG_PRODUCT_LOOKUP = newLookup;
      window.CODE_TO_TOP_KEY = newCodeToTop;
    }

    if ((priceNameImageUpdated > 0 || toDelete.length || toMove.length || toAdd.length || categoryIconsUpdated > 0) && typeof render === 'function') {
      render();
    }
  } catch (e) {
    console.warn("Firebase orqali narx/rasm yangilanishi yuklanmadi:", e);
  }
</script>
